name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  fast-pr-checks:
    name: Fast PR Checks (Lint, Typecheck, Unit, Contract, Audit, SBOM)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv 0.12.3
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"

      - name: Sync locked Python 3.12 dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy recsys_platform apps services

      - name: Run static AST, YAML, JSON, and tag hygiene audit
        run: uv run python scripts/static_audit.py

      - name: Run license compliance check & generate CycloneDX SBOM
        run: |
          uv run python scripts/check_licenses.py
          uv run python scripts/generate_sbom.py

      - name: Run unit, Hypothesis property, and Avro contract tests
        run: uv run pytest -v -m "unit or contract"

  integration-chaos-smoke:
    name: Integration, E2E, Chaos Drills & Standalone Container Build
    runs-on: ubuntu-24.04
    needs: [fast-pr-checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv 0.12.3
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"

      - name: Sync locked Python 3.12 dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Validate Feast repository definitions
        run: |
          uv run python scripts/run_vertical_slice.py --seed 42
          uv run python services/feature_materializer.py --export-feast
          uv run feast -c feast_repo apply

      - name: Run integration, E2E, chaos, and performance smoke tests
        run: uv run pytest -v -m "integration or e2e or chaos or performance"

      - name: Validate standalone Dockerfile build
        run: docker build -f infra/docker/Dockerfile.standalone -t recsys-platform:ci-test .
