global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: recsys-api
    metrics_path: /metrics
    static_configs:
      - targets: ["recsys-api:8030", "host.docker.internal:8030"]
        labels:
          service: recsys-feature-experiment-platform
