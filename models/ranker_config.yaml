# Ranker configuration and model governance policy
# Zero external pretrained weights are downloaded or required.
policy:
  pretrained_weights: none
  training_data_source: synthetic_seeded_iceberg_pit
  license: Apache-2.0
  chronological_split_ratio: 0.75

feature_columns:
  - user_watch_seconds_total
  - user_play_count
  - user_completion_rate
  - user_skip_rate
  - user_rebuffer_rate
  - genre_match
  - item_popularity_prior
  - item_completion_rate_so_far
  - item_duration_seconds
  - is_cold_start_user
  - is_cold_start_item

models:
  baseline_logreg:
    algorithm: scikit-learn LogisticRegression (StandardScaler pipeline)
    hyperparameters:
      C: 1.0
      max_iter: 300
    experiment_variant: control

  treatment_gbdt:
    algorithm: scikit-learn HistGradientBoostingClassifier
    hyperparameters:
      max_iter: 50
      max_depth: 3
      learning_rate: 0.05
      min_samples_leaf: 30
      l2_regularization: 5.0
    experiment_variant: treatment
